name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs of the same workflow + ref (avoid wasted CI on
# rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres service for the phase-2 DB-integration tests
    # (tests/test_load.py, tests/test_runs.py). Skipped automatically
    # if NEON_DATABASE_URL is unset; here we set it.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: ctp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEON_DATABASE_URL: postgresql://postgres:x@localhost:5432/ctp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dev env (frozen)
        run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest
        run: uv run pytest
