name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel in-flight runs of the same workflow + ref (avoid wasted CI on
# rapid pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal default permissions — this workflow only reads the checkout.
permissions:
  contents: read

jobs:
  ci:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Postgres service for the phase-2 DB-integration tests
    # (tests/test_load.py, tests/test_runs.py). Skipped automatically
    # if NEON_DATABASE_URL is unset; here we set it.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: ctp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEON_DATABASE_URL: postgresql://postgres:x@localhost:5432/ctp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dev env (frozen)
        run: uv sync --frozen

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format check)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pytest
        run: uv run pytest

  dbt:
    name: dbt build · test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same pattern as the ci job: postgres:15 as a service so dbt can build
    # against a freshly-seeded raw schema (no live Neon, no OTX hit).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: ctp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # For the seed script (app env, psycopg).
      NEON_DATABASE_URL: postgresql://postgres:x@localhost:5432/ctp
      # For dbt-postgres (transform env, profiles.yml.example reads these).
      NEON_HOST: localhost
      NEON_PORT: "5432"
      NEON_USER: postgres
      NEON_PASSWORD: x
      NEON_DB: ctp
      NEON_SSLMODE: disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            transform/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Apply sql/ DDL
        run: |
          psql "postgresql://postgres:x@localhost:5432/ctp" \
            -v ON_ERROR_STOP=1 \
            -f sql/00_schemas.sql \
            -f sql/10_raw.sql \
            -f sql/20_pipeline.sql \
            -f sql/30_grafana_role.sql

      - name: Sync app env (frozen) + seed fixture corpus
        run: |
          uv sync --frozen
          uv run python -m scripts.seed_fixture_corpus

      - name: dbt build (isolated transform env)
        run: |
          cp transform/profiles.yml.example transform/profiles.yml
          make -C transform build

      - name: dbt docs generate (smoke-check the lineage graph)
        run: make -C transform docs

  evidence:
    name: evidence · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Mirrors the dbt job's setup so the Evidence build sees a populated
    # marts schema, then adds `npm ci`/`npm run sources`/`npm run build`
    # + a secret-grep on the build output (spec 05 §7).
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: x
          POSTGRES_DB: ctp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NEON_DATABASE_URL: postgresql://postgres:x@localhost:5432/ctp
      NEON_HOST: localhost
      NEON_PORT: "5432"
      NEON_USER: postgres
      NEON_PASSWORD: x
      NEON_DB: ctp
      NEON_SSLMODE: disable
      # Evidence: single connection URL drives the `neon` source.
      EVIDENCE_SOURCE__neon__connectionString: postgresql://postgres:x@localhost:5432/ctp?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            transform/uv.lock

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: reporting/package-lock.json

      - name: Apply sql/ DDL
        run: |
          psql "postgresql://postgres:x@localhost:5432/ctp" \
            -v ON_ERROR_STOP=1 \
            -f sql/00_schemas.sql \
            -f sql/10_raw.sql \
            -f sql/20_pipeline.sql \
            -f sql/30_grafana_role.sql

      - name: Sync app env (frozen) + seed fixture corpus
        run: |
          uv sync --frozen
          uv run python -m scripts.seed_fixture_corpus

      - name: dbt build (isolated transform env)
        run: |
          cp transform/profiles.yml.example transform/profiles.yml
          make -C transform build

      # Phase 4 writes reporting/pages/analyst-brief.md on every `make
      # analysis`. The file is gitignored, so the CI checkout never has
      # it; we synthesize it here with a mocked local provider so the
      # Evidence build can render the analyst-brief route (spec 05 §1).
      - name: Generate analyst-brief.md (mocked provider)
        env:
          OTX_API_KEY: dummy
        run: |
          uv run python -c "
          from cyber_threat_pipeline.analysis import providers
          o = providers.PROVIDERS['local']
          providers.PROVIDERS['local'] = providers.Provider(
              name=o.name,
              query=lambda *a, **kw: '## Headline\nCI-mocked brief.',
              default_model=o.default_model,
              credential_kind=o.credential_kind,
              credential_attr=o.credential_attr,
              display_label=o.display_label,
          )
          from cyber_threat_pipeline.analysis import __main__ as m
          m.run()
          "

      - name: Evidence — install deps
        working-directory: reporting
        run: npm ci

      - name: Evidence — materialize SQL sources
        working-directory: reporting
        run: npm run sources

      - name: Evidence — static build
        working-directory: reporting
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f reporting/build/index.html
          test -f reporting/build/freshness/index.html
          test -f reporting/build/analyst-brief/index.html

      - name: Secret-grep build/ (spec 05 §7)
        run: |
          if grep -rIEn '(password=|NEON_DATABASE_URL|postgresql://[^"]*:[^"@]+@|postgres:x|sk-[a-zA-Z0-9]{20}|xai-[a-zA-Z0-9]{20})' reporting/build/; then
            echo "::error::Secret-like string found in reporting/build/"
            exit 1
          fi

  monitoring:
    name: monitoring · validate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    # YAML + JSON syntactic check only. Doesn't verify Grafana semantics
    # (panel rendering, alert eval against live data) — those are operator-
    # side checks against the actual Grafana Cloud tenant.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate dashboard.json (json.load)
        run: |
          python -c "
          import json
          d = json.load(open('monitoring/dashboard.json'))
          assert d['title'], 'dashboard.json missing title'
          assert d['panels'], 'dashboard.json has no panels'
          print(f'OK dashboard.json — {len(d[\"panels\"])} panels')
          "

      - name: Validate alerts.yaml (yaml.safe_load)
        run: |
          python -c "
          import yaml
          d = yaml.safe_load(open('monitoring/alerts.yaml'))
          assert d['apiVersion'] == 1, 'alerts.yaml: apiVersion != 1'
          rules = d['groups'][0]['rules']
          assert len(rules) == 4, f'alerts.yaml: expected 4 rules, got {len(rules)}'
          print(f'OK alerts.yaml — {len(rules)} rules')
          "

      - name: Validate datasource.example.yaml (yaml.safe_load)
        run: |
          python -c "
          import yaml
          d = yaml.safe_load(open('monitoring/datasource.example.yaml'))
          assert d['apiVersion'] == 1, 'datasource.example.yaml: apiVersion != 1'
          # Accept the legacy plugin id ('postgres') and the modern rebrand
          # ('grafana-postgresql-datasource', shipped in Grafana 10.2.3+).
          # The template ships with the modern id; the legacy form still
          # resolves on older self-hosted Grafana installs.
          ds_type = d['datasources'][0]['type']
          assert ds_type in ('postgres', 'grafana-postgresql-datasource'), f'datasource type unexpected: {ds_type!r}'
          print('OK datasource.example.yaml')
          "

  terraform:
    name: terraform · validate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # HCL-only check: `terraform fmt -check` + `terraform validate`. No
    # AWS creds needed — `init -backend=false` downloads the provider but
    # doesn't touch any AWS account. `terraform plan`/`apply` are
    # operator actions (spec 05 §B8).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.5"
          terraform_wrapper: false

      - name: terraform fmt (check)
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: infra
        run: terraform validate
