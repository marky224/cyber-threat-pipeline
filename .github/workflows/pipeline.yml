name: pipeline

# Weekly OTX → Neon → dbt → analyst brief → Evidence deploy.
# Manual `workflow_dispatch` mirrors the cron for ad-hoc runs.
#
# Per the locked decisions, this workflow IS the orchestration. Stages
# invoke the top-level Makefile (single source of truth). Auth to AWS is
# OIDC-only; the deploy IAM role + GitHub OIDC provider are Terraformed in
# infra/ — see _private/specs/05-reporting-evidence.md and 07-orchestration.md.
#
# Phase-status legend mirrors the Makefile:
#   [ready]    runs today.
#   [phase N]  scaffolded; runs once the matching spec/code lands.

on:
  schedule:
    # Mondays 13:00 UTC — early week, off-peak.
    - cron: "0 13 * * 1"
  workflow_dispatch:
    inputs:
      force_full_backfill:
        description: "Skip the watermark and full-backfill ingest (TRUE/FALSE)"
        required: false
        default: "false"

concurrency:
  group: pipeline
  cancel-in-progress: false

# OIDC + minimal read for checkout. No static AWS keys anywhere.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  pipeline:
    name: weekly run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      # -------------------------------------------------------------------
      # Setup
      # -------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dev env (frozen)
        run: uv sync --frozen

      # -------------------------------------------------------------------
      # AWS auth — OIDC, no static keys.
      # The role-to-assume ARN comes from the deploy role Terraformed in
      # infra/ (see _private/specs/05-reporting-evidence.md). Trust policy
      # is scoped to this repo + main branch (and workflow_dispatch).
      # -------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cyber-threat-pipeline-${{ github.run_id }}

      # -------------------------------------------------------------------
      # [phase 2] Ingest — OTX → Neon raw schema
      # Reads NEON_DATABASE_URL + OTX_API_KEY. Inserts a pipeline_runs row
      # at start, advances pipeline_state watermark on load success.
      # -------------------------------------------------------------------
      - name: Ingest (OTX → Neon)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          # `|| 'false'`: `schedule` runs don't apply workflow_dispatch input
          # defaults, so inputs.force_full_backfill is empty on cron. Without the
          # fallback the blank value crashes Settings() at parse time.
          FORCE_FULL_BACKFILL: ${{ inputs.force_full_backfill || 'false' }}
        run: make ingest

      # -------------------------------------------------------------------
      # [phase 3] Transform — dbt build (isolated transform/ env)
      #
      # dbt-postgres reads discrete NEON_HOST/PORT/USER/PASSWORD/DB/SSLMODE
      # env vars (per transform/profiles.yml.example). Parse the pooled
      # NEON_DATABASE_URL once here and export the components into
      # $GITHUB_ENV so this and the evidence step below can use them
      # without re-parsing.
      # -------------------------------------------------------------------
      - name: Decompose NEON_DATABASE_URL → NEON_HOST/PORT/USER/PASSWORD/DB
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        # Each `::add-mask::` line tells the runner to redact that value
        # in any subsequent log output (including from later steps), so the
        # password / host / user / db are not exposed when downstream steps
        # `echo $NEON_*` or when GitHub auto-renders the env block at step
        # start. This is the GitHub-Actions equivalent of marking the value
        # a secret at runtime.
        run: |
          python3 - <<'PY'
          import os, urllib.parse as up
          p = up.urlparse(os.environ["NEON_DATABASE_URL"])
          fields = {
              "NEON_HOST":     p.hostname,
              "NEON_PORT":     str(p.port or 5432),
              "NEON_USER":     p.username,
              "NEON_PASSWORD": p.password,
              "NEON_DB":       p.path.lstrip("/"),
              "NEON_SSLMODE":  "require",
          }
          # Mask BEFORE exporting so the values don't surface in any
          # following auto-echoed env block.
          for v in (p.hostname, p.username, p.password, p.path.lstrip("/")):
              if v:
                  print(f"::add-mask::{v}")
          # Now export to $GITHUB_ENV for the next step.
          with open(os.environ["GITHUB_ENV"], "a") as f:
              for k, v in fields.items():
                  f.write(f"{k}={v}\n")
          PY

      - name: dbt build (transform)
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          # transform/profiles.yml is gitignored; copy the template before
          # dbt resolves the profile.
          cp transform/profiles.yml.example transform/profiles.yml
          make transform

      # -------------------------------------------------------------------
      # [phase 7] Record dbt test results into pipeline.runs
      #
      # The latest 'running' row was opened by the ingest step; this writes
      # dbt_tests_passed/failed/skipped into it so the Grafana panel can
      # render the test history. Fail-fast if no running row exists — that
      # would mean ingest didn't open one, which is a real upstream failure
      # we don't want to silently mask.
      # Spec: 07-orchestration.md §3.
      # -------------------------------------------------------------------
      - name: Record dbt test results
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          uv run python - <<'PY'
          import os, sys, psycopg
          from cyber_threat_pipeline.core.runs import latest_run_id, record_dbt_results

          with psycopg.connect(os.environ["NEON_DATABASE_URL"]) as conn:
              run_id = latest_run_id(conn)
              if run_id is None:
                  sys.exit("no pipeline.runs row to update — ingest step must have failed")
              passed, failed, skipped = record_dbt_results(
                  conn, run_id=run_id, results_path="transform/target/run_results.json"
              )
              print(f"recorded dbt tests on run {run_id}: passed={passed} failed={failed} skipped={skipped}")
          PY

      # -------------------------------------------------------------------
      # [phase 4] Analyst brief
      # Writes markdown into reporting/pages/ for the Evidence build.
      # ANALYSIS_PROVIDERS picks which slots run; default 'claude' is the
      # single-model production setup. Override via Repository Variable
      # (NOT a Secret — non-sensitive).
      # -------------------------------------------------------------------
      - name: Analyst brief
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # OTX_API_KEY is required by Settings() at construction even
          # though the analysis stage doesn't hit OTX — Settings validates
          # all fields up-front (core/config.py marks OTX_API_KEY as
          # required for the ingestion path).
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          ANALYSIS_PROVIDERS: ${{ vars.ANALYSIS_PROVIDERS || 'claude' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: make analysis

      # -------------------------------------------------------------------
      # [phase 5] Build + deploy Evidence site
      # Evidence builds against Neon at build time (pooled connection).
      # Deploy = aws s3 sync + CloudFront invalidation; bucket + dist id
      # are outputs of the Terraform stack in infra/.
      # -------------------------------------------------------------------
      - name: Set up Node 20 (Evidence build)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: reporting/package-lock.json

      - name: Build + deploy Evidence site
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          # Evidence reads the postgres source via a single connection-string
          # env var — same value as NEON_DATABASE_URL; the variable name is
          # what the Evidence postgres adapter looks for.
          EVIDENCE_SOURCE__neon__connectionString: ${{ secrets.NEON_DATABASE_URL }}
          REPORT_BUCKET: ${{ secrets.REPORT_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: make report
