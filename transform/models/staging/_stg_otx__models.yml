version: 2

models:
  - name: stg_otx__pulses
    columns:
      - name: id
        tests: [not_null, unique]
      - name: tlp
        tests:
          - accepted_values:
              arguments:
                values: ['white', 'green', 'amber', 'red']
                quote: true

  - name: stg_otx__indicators
    columns:
      - name: id
        tests: [not_null, unique]
      - name: pulse_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_otx__pulses')
                field: id
      - name: type
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'FileHash-SHA256'
                  - 'FileHash-SHA1'
                  - 'FileHash-MD5'
                  - 'domain'
                  - 'hostname'
                  - 'URL'
                  - 'IPv4'
                  - 'IPv6'
                  - 'email'
                  - 'CIDR'
                  - 'FilePath'
                  - 'CVE'
                  - 'Mutex'
                  - 'YARA'
                  - 'BitcoinAddress'
                quote: true
              config:
                severity: warn
                # Saves the unexpected type(s) and their row counts to
                # dbt_test__audit.stg_otx__indicators_type_not_accepted, rebuilt
                # every run. grafana_ro has no access and no Evidence source reads it.
                store_failures: true
                alias: stg_otx__indicators_type_not_accepted
      - name: is_expired
        description: "Sync-time snapshot (incremental); read live flags from int_indicator_freshness."
      - name: is_dropped
        description: "Sync-time snapshot (incremental); read live flags from int_indicator_freshness."
      - name: is_active
        description: "Sync-time snapshot (incremental); read live flags from int_indicator_freshness."
