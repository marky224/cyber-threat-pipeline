version: 2

models:
  - name: mart_indicator_types
    columns:
      - name: type
        tests: [not_null, unique]

  - name: mart_indicator_freshness
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [type, freshness_bucket]

  - name: mart_top_pulses
    columns:
      - name: id
        tests: [not_null, unique]

  - name: mart_targeted_countries
    columns:
      - name: country
        tests: [not_null, unique]

  - name: mart_threat_tags
    columns:
      - name: tag
        tests: [not_null, unique]

  - name: mart_top_industries
    columns:
      - name: industry
        tests: [not_null, unique]

  - name: mart_pulse_trends_monthly
    columns:
      - name: month
        tests: [not_null, unique]

  - name: mart_data_quality
    columns:
      - name: run_id
        tests: [not_null]

  - name: brief_input
    columns:
      - name: generated_at
        tests: [not_null]
