# Pre-commit hooks. Install with: `uv run pre-commit install`.
# Run on demand: `uv run pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Pin to the same minor as the project's mypy (uv lock → 2.1.0). The
    # v1.14.1 mirror predates mypy 2.x's import-not-found / import-untyped
    # error-code split and reports false positives against this codebase.
    rev: v2.1.0
    hooks:
      - id: mypy
        # pydantic.mypy plugin is enabled in pyproject.toml; without these
        # the isolated mypy env can't import the plugin or resolve the
        # runtime symbols that strict-mode mypy inspects.
        additional_dependencies:
          - "pydantic>=2"
          - "pydantic-settings>=2.14.1"
          - "psycopg[binary]>=3.3.4"
          - "pytest>=8.3.0"
          - "OTXv2>=1.5,<2"
          - "types-requests"
        # Mirror the pyproject scope.
        files: ^(cyber_threat_pipeline|tests)/
        args: ["--config-file=pyproject.toml"]

  # GitLeaks — secret scanning. Catches accidental API keys / credentials
  # before they ever reach a commit. CI repeats the scan as a backstop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
