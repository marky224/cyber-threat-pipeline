# Pre-commit hooks. Install with: `uv run pre-commit install`.
# Run on demand: `uv run pre-commit run --all-files`.
# The mypy hook's `language: unsupported` was added in pre-commit 4.4.0.
minimum_pre_commit_version: "4.4.0"
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs in the project env (`uv run`, as `make typecheck` and CI do), so
  # it checks against the versions uv.lock pins; a mirror's isolated env
  # installs its own and drifts. `--frozen` uses uv.lock as is and never
  # re-locks mid-commit. Needs `uv` on PATH.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: unsupported
        types_or: [python, pyi]
        files: ^(cyber_threat_pipeline|tests)/
        # Checks pyproject's whole mypy scope, as CI does, not only the staged files.
        pass_filenames: false

  # GitLeaks — secret scanning. Catches accidental API keys / credentials
  # before they ever reach a commit. CI repeats the scan as a backstop.
  - repo: https://github.com/gitleaks/gitleaks
    # Moves with GITLEAKS_VERSION in .github/workflows/gitleaks.yml, which is bumped by hand.
    rev: v8.30.1
    hooks:
      - id: gitleaks
