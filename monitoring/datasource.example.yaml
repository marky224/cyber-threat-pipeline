# Grafana datasource provisioning template — Postgres (read-only Neon).
#
# This file is COMMITTED to the repo as a template; the real datasource is
# provisioned into Grafana Cloud either via the API or by pasting this
# template into the tenant's "Data sources → Add → Postgres" form. The
# secret (password for grafana_login) lives in Grafana Cloud's secret store
# and never lands in this file.
#
# Operator checklist (also in README.md §1):
#   1. Create the `grafana_login` Postgres user out-of-band against Neon:
#        CREATE USER grafana_login WITH PASSWORD '<generated>' IN ROLE grafana_ro;
#      (the `grafana_ro` GROUP role is created by sql/30_grafana_role.sql).
#   2. Capture the Neon pooled host + DB name; replace placeholders below.
#   3. Paste the generated password into Grafana Cloud's secret field — NOT
#      this file.
#   4. Adjust `postgresVersion` to match Neon's reported version at build
#      time (Grafana uses this to enable version-appropriate query helpers).

apiVersion: 1

datasources:
  - name: neon_ro
    # `grafana-postgresql-datasource` is the modern plugin id (rebranded
    # from the legacy `postgres` in Grafana 10.2.3). Use the new id —
    # the legacy form still works for healthchecks/listing but the new
    # plugin's query path rejects queries until `database` is also set
    # under jsonData (see below).
    type: grafana-postgresql-datasource
    access: proxy
    url: <neon-pooled-host>:5432
    # Legacy location (still read by the SDK; harmless to keep).
    database: <neon-db-name>
    user: grafana_login
    secureJsonData:
      password: <managed-in-grafana-cloud>
    jsonData:
      sslmode: require
      timescaledb: false
      postgresVersion: 1500
      # REQUIRED for the new `grafana-postgresql-datasource` plugin. The
      # frontend's SqlDatasource fails queries with "you do not currently
      # have a default database configured" if this is missing — even
      # though the legacy top-level `database` field is set above.
      database: <neon-db-name>
